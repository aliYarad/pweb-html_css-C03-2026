<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media & Kontak - Portfolio</title>
    <link rel="stylesheet" href="css/landing-page.css">
    <link rel="stylesheet" href="css/cv.css">
    <link rel="stylesheet" href="css/media.css">
</head>
<body>

    <!-- Navbar untuk Pindah (Switch) Halaman -->
         <nav class="navbar">
            <div class="logo">Portfolio.</div>
            <ul class="nav-links">
                <li><a href="landing-page.html">Landing Page</a></li>
                <li><a href="cv.html">Creative CV</a></li>
                <li><a href="media.html" class="active">Media & Kontak</a></li>
            </ul>
        </nav>

    <div class="horizontal-container">
        <!-- Halaman Ketiga: Media & Kontak -->
        <section class="media-contact-section">
            
            <!-- Sisi Kiri: Media Hub -->
            <div class="media-hub-pane">
                <div class="pane-title">MEDIA HUB</div>
                <div class="media-grid">
                    <div class="media-card">
                        <img src="https://akcdn.detik.net.id/community/media/visual/2016/10/03/f0bb6a92-56e3-4b10-8638-edbe8cb56c40.jpg?w=700&q=90" 
                        alt="Wajah Bahagia Maudy Ayunda Lulus di Oxford" 
                        style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px;" />
                    </div>
                    <div class="media-card">
                        <img src="https://img.antaranews.com/cache/1200x800/2026/03/30/ad61a9c3-c0ae-4938-a530-094c9fee797d.jpeg.webp" 
                        alt="Maudy Film Para Perasuk" 
                        style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px;" />
                    </div>
                    <div class="media-card">
                        <img src="https://cdn1-production-images-kly.akamaized.net/vcFw5dYc-jzGQyODyobCxpy88Wg=/535x710/smart/filters:quality(75):strip_icc():format(webp)/kly-media-production/medias/1109466/original/8087e1813d20d47f2f7d57cd1ae4a382a__1_.jpg" 
                        alt="Maudy as a singer" 
                        style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px;" />
                    </div>
                    <div class="media-card">
                        <img src="https://image.idntimes.com/post/20260712/1000029975_5404c419-920d-461b-b549-47c4e83f9fd8.jpg?tr=w-1200,f-webp,q-75&width=1200&format=webp&quality=75" 
                        alt="Maudy as a singer" 
                        style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px;" />
                    </div>
                </div>
            </div>

            <!-- Sisi Kanan: Form Kontak (Kotak Kedua) -->
            <div class="contact-form-pane">
                
                <h2 class="contact-title">GET IN TOUCH</h2>
                
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Masukkan nama Anda">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="nama@email.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" class="form-control" placeholder="Tulis pesanmu di sini..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">SEND MESSAGE</button>
                </form>
            </div>

        </section>
    </div>

</body>
</html>
